# Publishes public/ to GitLab Pages. The kernel and initrd are prebuilt and
# committed (see guest/), so the job only has to upload the folder.
pages:
  stage: deploy
  image: alpine:latest
  script:
    - ls -la public public/images
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
